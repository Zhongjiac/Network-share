<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网快传 - 扫码互联指南</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: #e2e8f0;
            --success: #16a34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            background: var(--card-bg);
            max-width: 650px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 36px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .header { margin-bottom: 20px; }
        .header h1 { font-size: 26px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .header p { font-size: 14px; color: var(--text-sub); }
        
        .qr-wrapper {
            display: inline-block;
            background: #ffffff;
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
            margin: 14px 0;
        }

        .url-box {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 16px 0;
        }
        .url-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .copy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .copy-btn:hover { background: var(--primary-hover); }

        .info-card {
            text-align: left;
            background: #f8fafc;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid var(--border);
            margin-top: 18px;
        }
        .info-item {
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.6;
        }
        .info-item:last-child { margin-bottom: 0; }
        .info-title { font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
        .code-inline {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
        }
    </style>
</head>

    <script>
        // 若静态 SVG 缺失，自动调用本地纯原生离线引擎动态补全
        (function() {
            const container = document.getElementById("qrContainer");
            if (container && (!container.querySelector("svg") || container.innerHTML.trim() === "")) {
                const url = document.getElementById("targetUrl").innerText.trim();
                if (window.LanQRCode && typeof window.LanQRCode.createSvg === 'function') {
                    container.innerHTML = window.LanQRCode.createSvg(url, { margin: 4, size: 220, level: 'M' });
                }
            }
        })();

        function copyLink() {
            const text = document.getElementById("targetUrl").innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("已复制链接到剪贴板！可以直接微信/QQ发给好友或在手机输入。");
            }).catch(() => {
                const input = document.createElement("input");
                input.value = text;
                document.body.appendChild(input);
                input.select();
                document.execCommand("copy");
                document.body.removeChild(input);
                alert("已复制链接到剪贴板！");
            });
        }
    </script>
